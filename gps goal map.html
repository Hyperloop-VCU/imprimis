<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Goal Map</title>
<!-- Vendored locally so the page works with no internet. See gps_goal_map_assets/. -->
<link rel="stylesheet" href="gps_goal_map_assets/leaflet.min.css">
<script src="gps_goal_map_assets/leaflet.min.js"></script>
<script src="gps_goal_map_assets/roslib.min.js"></script>
<style>
  :root {
    --bg: #14171a;
    --panel: rgba(20, 23, 26, 0.92);
    --line: #2c3238;
    --text: #d7dde2;
    --dim: #7d8790;
    --accent: #57c4ad;      /* robot */
    --goal: #e8b64c;        /* staged goal */
    --published: #66d34f;   /* last published goal */
    --danger: #d96a5a;
    --mono: "SF Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace;
    --sans: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); }
  #map { position: absolute; inset: 0; background: #0a0c0e; }

  /* ---------- control panel ---------- */
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    width: 300px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    backdrop-filter: blur(6px);
    font-size: 13px;
  }
  #panel header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none;
  }
  #panel header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; flex: 1; }
  #statusDot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--danger); flex-shrink: 0;
    transition: background 0.2s;
  }
  #statusDot.connected { background: var(--accent); }
  #statusDot.connecting { background: var(--goal); }
  #collapseArrow { color: var(--dim); font-size: 11px; transition: transform 0.15s; }
  #panel.collapsed #collapseArrow { transform: rotate(-90deg); }
  #panel.collapsed #panelBody { display: none; }

  section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: none; }
  section h2 {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--dim); margin-bottom: 8px;
  }
  label { display: block; font-size: 11px; color: var(--dim); margin: 8px 0 3px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], select {
    width: 100%; padding: 6px 8px;
    background: #0e1114; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px;
    font-family: var(--mono); font-size: 12px;
  }
  input[type=text]:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  button {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px;
    background: #1d2226; color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; width: 100%;
  }
  button:hover { background: #262c31; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0c1512; }
  button.primary:hover { background: #6cd2bc; }
  button.goal-btn { background: var(--goal); border-color: var(--goal); color: #1d1608; }
  button.goal-btn:hover { background: #f0c565; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row button { flex: 1; }

  .readout {
    font-family: var(--mono); font-size: 12px;
    display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
  }
  .readout .k { color: var(--dim); }
  .readout .v { text-align: right; }

  .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
  .toggle-row input { accent-color: var(--accent); }

  #goalSection .coords {
    font-family: var(--mono); font-size: 12px; margin-bottom: 8px;
    padding: 6px 8px; background: #0e1114; border-radius: 5px; border: 1px solid var(--line);
  }
  #goalHint { font-size: 11px; color: var(--dim); }
  .coord-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .coord-grid label { margin: 0 0 3px; }
  #manualErr { font-size: 11px; color: var(--danger); margin-top: 6px; min-height: 0; }
  #offlineNote {
    display: none; margin: 0 12px 10px; padding: 6px 8px;
    background: rgba(232, 182, 76, 0.12); border: 1px solid var(--goal);
    border-radius: 5px; font-size: 11px; color: var(--goal); line-height: 1.4;
  }
  #pubFlash { font-size: 11px; color: var(--accent); margin-top: 6px; min-height: 14px; }
  #publishedCoords { border-color: var(--published); color: var(--published); }
  #connError { font-size: 11px; color: var(--danger); margin-top: 6px; min-height: 0; word-break: break-word; }

  /* ---------- map markers ---------- */
  .robot-marker { filter: drop-shadow(0 0 4px rgba(87, 196, 173, 0.8)); }
  .goal-marker  { filter: drop-shadow(0 0 4px rgba(232, 182, 76, 0.8)); }
  .published-marker { filter: drop-shadow(0 0 4px rgba(102, 211, 79, 0.85)); }

  .leaflet-container { font-family: var(--sans); }
  .leaflet-control-attribution { background: rgba(20,23,26,0.75) !important; color: var(--dim) !important; }
  .leaflet-control-attribution a { color: var(--dim) !important; }

  @media (max-width: 480px) {
    #panel { width: calc(100% - 24px); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <header id="panelHeader">
    <div id="statusDot"></div>
    <h1>GPS GOAL MAP</h1>
    <span id="collapseArrow">&#9660;</span>
  </header>
  <div id="panelBody">
    <div id="offlineNote"></div>

    <section>
      <h2>Connection</h2>
      <label for="rosUrl">rosbridge websocket</label>
      <input type="text" id="rosUrl" value="ws://localhost:9090">
      <div class="row">
        <button id="connectBtn" class="primary">Connect</button>
      </div>
      <div id="connError"></div>
    </section>

    <section>
      <h2>Display</h2>
      <div class="toggle-row" style="margin-top:0;">
        <input type="checkbox" id="mapChk" checked>
        <label for="mapChk" style="margin:0; color:var(--text);">Show map</label>
      </div>
    </section>

    <section>
      <h2>Robot</h2>
      <div class="readout">
        <span class="k">lat</span><span class="v" id="roLat">—</span>
        <span class="k">lon</span><span class="v" id="roLon">—</span>
        <span class="k">fix rate</span><span class="v" id="roRate">—</span>
        <span class="k">fixes</span><span class="v" id="roCount">0</span>
        <span class="k">age</span><span class="v" id="roAge">—</span>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="followChk" checked>
        <label for="followChk" style="margin:0; color:var(--text);">Follow robot</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="trailChk" checked>
        <label for="trailChk" style="margin:0; color:var(--text);">Show trail</label>
      </div>
      <div class="row">
        <button id="centerBtn">Center on robot</button>
        <button id="clearTrailBtn">Clear trail</button>
      </div>
    </section>

    <section id="goalSection">
      <h2>Goal</h2>
      <div id="goalHint">Click the map to place a goal, or type coordinates below.</div>

      <div class="coord-grid" style="margin-top:8px;">
        <div>
          <label for="manLat">latitude</label>
          <input type="text" id="manLat" inputmode="decimal" placeholder="37.545358" autocomplete="off">
        </div>
        <div>
          <label for="manLon">longitude</label>
          <input type="text" id="manLon" inputmode="decimal" placeholder="-77.448637" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <button id="setManualBtn">Set goal from coordinates</button>
      </div>
      <div id="manualErr"></div>

      <div id="goalDetails" style="display:none; margin-top:8px;">
        <div class="coords" id="goalCoords"></div>
        <div class="row">
          <button id="publishGoalBtn" class="goal-btn">Publish goal</button>
          <button id="clearGoalBtn">Clear</button>
        </div>
      </div>
      <div id="pubFlash"></div>

      <div id="publishedRow" style="display:none;">
        <label>last published goal</label>
        <div class="coords" id="publishedCoords" style="margin-bottom:0;"></div>
      </div>
    </section>

  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------- topic names
const FIX_TOPIC  = '/gps/fix';
const GOAL_TOPIC = '/gps_waypoint_goal';
const GOAL_TYPE  = 'geographic_msgs/msg/GeoPoint';

// ---------------------------------------------------------------- map setup
// The map is the ONLY part of this page allowed to fail without internet.
// Everything below is written so that a missing Leaflet, missing tile cache or
// dead network degrades the basemap and nothing else.
const HAS_LEAFLET = (typeof L !== 'undefined');
let map = null;

// Tile source: try the local cache first, fall back to Esri if we're online.
// Cached area: 0.5 mi around VCU College of Engineering East Hall (37.545358, -77.448637).
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const LAYER_DEFS = [
  { local: 'gps_goal_map_assets/tiles/imagery/{z}/{y}/{x}.png',
    remote: ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 24, maxNativeZoom: 20,
            attribution: 'Imagery &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics' } },
  // hybrid labels/roads overlay (subtle, helps orientation)
  { local: 'gps_goal_map_assets/tiles/reference/{z}/{y}/{x}.png',
    remote: ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 24, maxNativeZoom: 19, opacity: 0.75 } }
];

let tileFailures = 0;
let remoteTilesDead = false;    // latched once the live service is clearly unreachable
let remoteMisses = 0;
function noteTileFailure() {
  if (++tileFailures === 8) {
    showNote('Basemap tiles unavailable here \u2014 you are outside the cached area ' +
             '(0.5 mi around VCU Engineering East Hall) with no internet. ' +
             'Position tracking and goal publishing are unaffected.');
  }
  // Offline, every uncached tile costs a doomed request that ties up a socket
  // until it times out. After enough misses stop trying and fail fast instead.
  if (!remoteTilesDead && ++remoteMisses >= 24) remoteTilesDead = true;
}

// Tile layer that falls back local -> remote before giving up.
const CachedTileLayer = HAS_LEAFLET ? L.TileLayer.extend({
  // build a URL from the remote template using Leaflet's own coord math
  _remoteUrl: function (coords) {
    const saved = this._url;
    this._url = this.options.remoteUrl;
    const url = this.getTileUrl(coords);
    this._url = saved;
    return url;
  },
  createTile: function (coords, done) {
    const tile = document.createElement('img');
    tile.alt = '';
    let triedRemote = false;
    L.DomEvent.on(tile, 'load', L.Util.bind(function (e) {
      if (triedRemote) { remoteMisses = 0; }   // service is alive again
      this._tileOnLoad(done, tile, e);
    }, this));
    L.DomEvent.on(tile, 'error', L.Util.bind(function (e) {
      if (!triedRemote && !remoteTilesDead) {   // local cache miss -> try live service
        triedRemote = true;
        tile.src = this._remoteUrl(coords);
        return;
      }
      noteTileFailure();            // offline AND uncached: give up on this tile
      this._tileOnError(done, tile, e);
    }, this));
    tile.src = this.getTileUrl(coords);
    return tile;
  }
}) : null;

if (HAS_LEAFLET) {
  // preferCanvas: the trail and accuracy circle are redrawn on every fix; the
  // canvas renderer costs far less than one SVG path element per vertex.
  map = L.map('map', { zoomControl: true, maxZoom: 24, preferCanvas: true })
         .setView([40.0, -83.0], 4);
  map.zoomControl.setPosition('bottomright');
  LAYER_DEFS.forEach(d => {
    new CachedTileLayer(d.local, Object.assign({ remoteUrl: d.remote }, d.opts)).addTo(map);
  });
}

// ---------------------------------------------------------------- markers
const robotIcon = !HAS_LEAFLET ? null : L.divIcon({
  className: 'robot-marker',
  html: '<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="7" fill="#57c4ad" stroke="#0c1512" stroke-width="2.5"/><circle cx="13" cy="13" r="2.4" fill="#0c1512"/></svg>',
  iconSize: [26, 26], iconAnchor: [13, 13]
});
const goalIcon  = !HAS_LEAFLET ? null : L.divIcon({
  className: 'goal-marker',
  html: '<svg width="30" height="38" viewBox="0 0 30 38"><path d="M15 1 C7 1 1 7 1 15 c0 10 14 22 14 22 s14-12 14-22 C29 7 23 1 15 1z" fill="#e8b64c" stroke="#1d1608" stroke-width="2.5"/><circle cx="15" cy="15" r="4.5" fill="#1d1608"/></svg>',
  iconSize: [30, 38], iconAnchor: [15, 37]
});

// A check inside a circle, centred on the point: distinct from the amber pin
// (whose tip marks the point) so a staged goal sitting on top of the published
// one still reads clearly.
const publishedIcon = !HAS_LEAFLET ? null : L.divIcon({
  className: 'published-marker',
  html: '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.5" fill="#66d34f" stroke="#0d1a08" stroke-width="2"/><path d="M7 11.3 l2.8 2.8 l5.2 -5.6" fill="none" stroke="#0d1a08" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  iconSize: [22, 22], iconAnchor: [11, 11]
});

let robotMarker = null;
let publishedMarker = null;
let publishedGoal = null;   // {lat, lng} of the most recent successful publish
let accuracyCircle = null;
let goalMarker = null;
// Trail cost is what grows without bound if left alone: a stationary robot at
// 5 Hz still appends 18k vertices an hour, and every one of them is re-projected
// on each pan. Gate on real movement and cap the total.
const TRAIL_MAX_POINTS = 1500;
const TRAIL_MIN_MOVE_M = 0.4;
let trailPts = [];
let trail = HAS_LEAFLET ? L.polyline([], { color: '#57c4ad', weight: 2, opacity: 0.65 }).addTo(map) : null;
let firstFix = true;
let mapShown = HAS_LEAFLET;   // hiding the map also stops its per-fix redraw work

// ---------------------------------------------------------------- state
const $ = id => document.getElementById(id);
let ros = null;
let fixSub = null;
let goalPub = null;
let lastFixTime = null;
let fixCount = 0;
let fixTimes = [];        // recent arrival times, for the rate readout
let lastFix = null;       // newest position, painted by the ticker
let pendingGoal = null;   // {lat, lng}

// ---------------------------------------------------------------- map visibility
// Hidden is a real mode, not just display:none — the per-fix marker, trail and
// follow work is skipped entirely, leaving a text-only console. Trail points
// keep accumulating in memory so unhiding shows an unbroken path.
function setMapVisible(show) {
  mapShown = show && HAS_LEAFLET && !!map;
  $('map').style.display = mapShown ? '' : 'none';
  $('centerBtn').disabled = !mapShown;
  $('goalHint').textContent = mapShown
    ? 'Click the map to place a goal, or type coordinates below.'
    : 'Map hidden \u2014 type coordinates below to set a goal.';
  if (!mapShown) return;

  map.invalidateSize();        // Leaflet cannot measure a display:none container
  if (trail) trail.setLatLngs(trailPts);
  syncPublishedMarker();
  if (lastFix) {
    const ll = [lastFix.lat, lastFix.lon];
    if (robotMarker) { robotMarker.setLatLng(ll); }
    else { robotMarker = L.marker(ll, { icon: robotIcon, zIndexOffset: 500 }).addTo(map); }
    if (firstFix) { map.setView(ll, 18); firstFix = false; }
    else if ($('followChk').checked) followRobot(ll);
  }
}
$('mapChk').addEventListener('change', (e) => setMapVisible(e.target.checked));

// ---------------------------------------------------------------- notices
function showNote(text) {
  const n = $('offlineNote');
  n.textContent = text;
  n.style.display = 'block';
}
if (!HAS_LEAFLET) {
  showNote('Map library failed to load, so there is no map. Everything else still works: ' +
           'connect to rosbridge and enter goal coordinates by hand below.');
  $('mapChk').checked = false;
  $('mapChk').disabled = true;
  setMapVisible(false);
}
if (typeof ROSLIB === 'undefined') {
  showNote('roslib failed to load \u2014 cannot talk to rosbridge. Check gps_goal_map_assets/.');
}

// ---------------------------------------------------------------- panel collapse
$('panelHeader').addEventListener('click', () => $('panel').classList.toggle('collapsed'));

// ---------------------------------------------------------------- connection
function setStatus(state, msg) {
  const dot = $('statusDot');
  dot.className = state;                       // '', 'connecting', 'connected'
  $('connError').textContent = msg || '';
  $('connectBtn').textContent = (state === 'connected') ? 'Disconnect' : 'Connect';
}

function teardownTopics() {
  if (fixSub) { fixSub.unsubscribe(); fixSub = null; }
  goalPub = null;
}

function connect() {
  if (typeof ROSLIB === 'undefined') {
    setStatus('', 'roslib not loaded \u2014 check gps_goal_map_assets/roslib.min.js');
    return;
  }
  if (ros) { ros.close(); return; }            // button doubles as disconnect
  setStatus('connecting', '');
  ros = new ROSLIB.Ros({ url: $('rosUrl').value.trim() });

  ros.on('connection', () => {
    setStatus('connected', '');
    setupTopics();
  });
  ros.on('error', (e) => {
    setStatus('', 'Connection error. Is rosbridge running? (ros2 launch rosbridge_server rosbridge_websocket_launch.xml)');
  });
  ros.on('close', () => {
    setStatus('', '');
    teardownTopics();
    ros = null;
  });
}
$('connectBtn').addEventListener('click', connect);

// ---------------------------------------------------------------- topics
function setupTopics() {
  if (!ros) return;
  teardownTopics();

  fixSub = new ROSLIB.Topic({
    ros: ros,
    name: FIX_TOPIC,
    messageType: 'sensor_msgs/msg/NavSatFix',
    throttle_rate: 200,
    queue_length: 1      // drop stale fixes rather than buffering a backlog
  });
  fixSub.subscribe(onFix);

  goalPub = new ROSLIB.Topic({
    ros: ros,
    name: GOAL_TOPIC,
    messageType: GOAL_TYPE
  });
  goalPub.advertise();
}

// ---------------------------------------------------------------- fix handling
function onFix(msg) {
  if (!isFinite(msg.latitude) || !isFinite(msg.longitude)) return;
  if (msg.status && msg.status.status === -1) return;   // STATUS_NO_FIX

  const ll = [msg.latitude, msg.longitude];
  fixCount++;
  lastFixTime = Date.now();
  fixTimes.push(lastFixTime);
  if (fixTimes.length > 50) fixTimes.shift();

  if (mapShown) {
    if (!robotMarker) {
      robotMarker = L.marker(ll, { icon: robotIcon, zIndexOffset: 500 }).addTo(map);
    } else {
      robotMarker.setLatLng(ll);
    }
  }

  // horizontal accuracy from covariance diagonal, if provided
  if (mapShown && msg.position_covariance_type > 0) {
    const r = Math.sqrt(Math.max(msg.position_covariance[0], msg.position_covariance[4]));
    if (isFinite(r) && r > 0) {
      if (!accuracyCircle) {
        accuracyCircle = L.circle(ll, { radius: r, color: '#57c4ad', weight: 1, opacity: 0.4, fillOpacity: 0.08 }).addTo(map);
      } else {
        accuracyCircle.setLatLng(ll).setRadius(r);
      }
    }
  }

  if (trail && $('trailChk').checked) addTrailPoint(msg.latitude, msg.longitude);

  if (mapShown) {
    if (firstFix) {
      map.setView(ll, 18);
      firstFix = false;
    } else if ($('followChk').checked) {
      followRobot(ll);
    }
  }

  // Readouts are painted by the ticker, not here: the DOM does not need to be
  // touched once per message to stay legible.
  lastFix = { lat: msg.latitude, lon: msg.longitude };
}

// Append only if the robot actually moved, and keep the vertex count bounded.
function addTrailPoint(lat, lon) {
  const prev = trailPts.length ? trailPts[trailPts.length - 1] : null;
  if (prev && map && map.distance(prev, [lat, lon]) < TRAIL_MIN_MOVE_M) return;
  trailPts.push([lat, lon]);
  if (trailPts.length > TRAIL_MAX_POINTS) trailPts.splice(0, trailPts.length - TRAIL_MAX_POINTS);
  if (!mapShown) return;                       // redrawn on unhide
  if (trailPts.length >= TRAIL_MAX_POINTS) trail.setLatLngs(trailPts);
  else trail.addLatLng([lat, lon]);
}

// Recenter only when the robot leaves the middle of the viewport, and do it
// without animation. panTo({animate:true}) at fix rate never lets the map idle:
// each call restarts a multi-frame transform plus a tile reflow.
function followRobot(ll) {
  const size = map.getSize();
  const p = map.latLngToContainerPoint(ll);
  const mx = size.x * 0.25, my = size.y * 0.25;
  if (p.x < mx || p.x > size.x - mx || p.y < my || p.y > size.y - my) {
    map.setView(ll, map.getZoom(), { animate: false });
  }
}

// Rate over a trailing window: intervals / span, which is exact while fixes are
// flowing. A stalled stream reports 0.0 rather than holding the last good value
// — "the GPS stopped" is the failure worth seeing in the field.
// Prunes fixTimes as a side effect; returns Hz.
const RATE_WINDOW_MS = 10000;   // long enough to time a 1 Hz or slower fix
function fixRateHz(now) {
  fixTimes = fixTimes.filter(t => now - t <= RATE_WINDOW_MS);
  const n = fixTimes.length;
  if (n < 2) return 0;
  const span = (fixTimes[n - 1] - fixTimes[0]) / 1000;
  if (span <= 0) return 0;
  const silence = (now - fixTimes[n - 1]) / 1000;
  const dead = Math.max(2, 3 * span / (n - 1));   // 3 missed intervals, min 2 s
  return silence < dead ? (n - 1) / span : 0;
}

// fix age + rate ticker
setInterval(() => {
  if (lastFixTime === null) return;
  const now = Date.now();

  if (lastFix) {
    $('roLat').textContent = lastFix.lat.toFixed(7);
    $('roLon').textContent = lastFix.lon.toFixed(7);
    $('roCount').textContent = fixCount;
  }

  const age = (now - lastFixTime) / 1000;
  $('roAge').textContent = age < 1 ? '<1 s' : age.toFixed(0) + ' s';
  $('roAge').style.color = age > 5 ? 'var(--danger)' : 'var(--text)';

  const hz = fixRateHz(now);
  $('roRate').textContent = hz.toFixed(1) + ' Hz';
  $('roRate').style.color = hz > 0 ? 'var(--text)' : 'var(--danger)';
}, 500);

$('centerBtn').addEventListener('click', () => {
  if (map && robotMarker) map.setView(robotMarker.getLatLng(), Math.max(map.getZoom(), 17));
});
$('clearTrailBtn').addEventListener('click', () => {
  trailPts = [];
  if (trail) trail.setLatLngs([]);
});
$('trailChk').addEventListener('change', (e) => {
  if (trail) trail.setStyle({ opacity: e.target.checked ? 0.65 : 0 });
});
if (!map) { $('centerBtn').disabled = true; $('clearTrailBtn').disabled = true; }

// ---------------------------------------------------------------- goal placement
// setGoal() is the single entry point: map clicks, marker drags and typed
// coordinates all funnel through it, so the manual path needs no map at all.
function setGoal(lat, lng, opts) {
  pendingGoal = { lat: lat, lng: lng };
  if (map) {
    const ll = L.latLng(lat, lng);
    if (!goalMarker) {
      goalMarker = L.marker(ll, { icon: goalIcon, draggable: true, zIndexOffset: 600 }).addTo(map);
      goalMarker.on('dragend', () => {
        const p = goalMarker.getLatLng();
        setGoal(p.lat, p.lng, { recenter: false });
      });
    } else {
      goalMarker.setLatLng(ll);
    }
    if (opts && opts.recenter) map.setView(ll, Math.max(map.getZoom(), 18));
  }
  renderGoal();
}

if (map) {
  map.on('click', (e) => setGoal(e.latlng.lat, e.latlng.lng, { recenter: false }));
}

function renderGoal() {
  if (!pendingGoal) return;
  $('goalHint').style.display = 'none';
  $('goalDetails').style.display = 'block';
  $('goalCoords').textContent = pendingGoal.lat.toFixed(7) + ', ' + pendingGoal.lng.toFixed(7);
  $('publishGoalBtn').disabled = !goalPub;
  $('publishGoalBtn').title = goalPub ? '' : 'Connect to rosbridge first';
  $('manLat').value = pendingGoal.lat.toFixed(7);
  $('manLon').value = pendingGoal.lng.toFixed(7);
  $('manualErr').textContent = '';
  $('pubFlash').textContent = '';
}

function clearGoal() {
  pendingGoal = null;
  if (map && goalMarker) { map.removeLayer(goalMarker); }
  goalMarker = null;
  $('goalDetails').style.display = 'none';
  $('goalHint').style.display = 'block';
  $('manLat').value = '';
  $('manLon').value = '';
  $('manualErr').textContent = '';
  $('pubFlash').textContent = '';
}
$('clearGoalBtn').addEventListener('click', clearGoal);

// ---------------------------------------------------------------- manual entry
// Accepts plain decimal degrees. Pasting "37.545358, -77.448637" into either
// box splits it across both, which is what you get from Google Maps.
function parseCoordPair() {
  let latRaw = $('manLat').value.trim();
  let lonRaw = $('manLon').value.trim();

  const combined = (latRaw.match(/,/) ? latRaw : (lonRaw.match(/,/) ? lonRaw : null));
  if (combined) {
    const parts = combined.split(',').map(t => t.trim()).filter(t => t.length);
    if (parts.length === 2) { latRaw = parts[0]; lonRaw = parts[1]; }
  }

  if (!latRaw || !lonRaw) return { err: 'Enter both latitude and longitude.' };

  const lat = Number(latRaw), lon = Number(lonRaw);
  if (!isFinite(lat) || !isFinite(lon)) return { err: 'Coordinates must be decimal degrees, e.g. 37.545358, -77.448637' };
  if (lat < -90 || lat > 90)   return { err: 'Latitude must be between -90 and 90.' };
  if (lon < -180 || lon > 180) return { err: 'Longitude must be between -180 and 180.' };
  return { lat: lat, lng: lon };
}

function applyManual() {
  const r = parseCoordPair();
  if (r.err) {
    $('manualErr').textContent = r.err;
    return;
  }
  setGoal(r.lat, r.lng, { recenter: true });
}
$('setManualBtn').addEventListener('click', applyManual);
['manLat', 'manLon'].forEach(id => {
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') applyManual(); });
});

// ---------------------------------------------------------------- goal publish
function rosTimeNow() {
  const ms = Date.now();
  return { sec: Math.floor(ms / 1000), nanosec: (ms % 1000) * 1e6 };
}

function buildGoalMessage(type, lat, lon) {
  switch (type) {
    case 'sensor_msgs/msg/NavSatFix':
      return {
        header: { stamp: rosTimeNow(), frame_id: 'gps' },
        status: { status: 0, service: 1 },
        latitude: lat, longitude: lon, altitude: 0.0,
        position_covariance: [0,0,0, 0,0,0, 0,0,0],
        position_covariance_type: 0
      };
    case 'geographic_msgs/msg/GeoPoseStamped':
      return {
        header: { stamp: rosTimeNow(), frame_id: 'wgs84' },
        pose: {
          position: { latitude: lat, longitude: lon, altitude: 0.0 },
          orientation: { x: 0, y: 0, z: 0, w: 1 }
        }
      };
    case 'geographic_msgs/msg/GeoPoint':
      return { latitude: lat, longitude: lon, altitude: 0.0 };
  }
}

let flashTimer = null;
function flash(text) {
  $('pubFlash').textContent = text;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { $('pubFlash').textContent = ''; }, 3000);
}

$('publishGoalBtn').addEventListener('click', () => {
  if (!pendingGoal || !goalPub) return;
  const msg = buildGoalMessage(GOAL_TYPE, pendingGoal.lat, pendingGoal.lng);
  goalPub.publish(new ROSLIB.Message(msg));
  markPublished(pendingGoal.lat, pendingGoal.lng);
  flash('Published to ' + goalPub.name);
});

// Remembers where the last goal was actually sent. Survives Clear: the staged
// goal is what you are about to send, this is what the robot was already given.
function markPublished(lat, lng) {
  publishedGoal = { lat: lat, lng: lng };
  $('publishedCoords').textContent = lat.toFixed(7) + ', ' + lng.toFixed(7);
  $('publishedRow').style.display = 'block';
  syncPublishedMarker();
}

function syncPublishedMarker() {
  if (!map || !publishedGoal) return;
  const ll = [publishedGoal.lat, publishedGoal.lng];
  if (!publishedMarker) {
    publishedMarker = L.marker(ll, { icon: publishedIcon, zIndexOffset: 400 }).addTo(map);
    publishedMarker.bindTooltip('last published goal');
  } else {
    publishedMarker.setLatLng(ll);
  }
}
</script>
</body>
</html>
