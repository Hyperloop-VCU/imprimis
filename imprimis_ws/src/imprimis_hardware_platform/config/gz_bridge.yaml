# Entries with a "sensor:" key are only bridged when the matching use_<sensor>
# launch argument is true (see imprimis_sim.launch.py). The key is stripped
# before the filtered config is handed to ros_gz_bridge. Valid values:
# lidar, imu, gps, cams. Entries without the key are always bridged.
# Camera entries run in a second bridge process (see imprimis_sim.launch.py) and are lazy:
# a camera topic is converted only while some ROS node subscribes to it. The depth point
# cloud alone is about 13 MB per message.

- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# gz topic published by DiffDrive plugin
- ros_topic_name: "diffbot_base_controller/odom"
  gz_topic_name: "diffbot_base_controller/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# gz topic published by DiffDrive plugin
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# gz topic subscribed to by DiffDrive plugin
- ros_topic_name: "diffbot_base_controller/cmd_vel"
  gz_topic_name: "diffbot_base_controller/cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# gz topic published by JointState plugin
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# gz topic published by sensors plugin (lidar)
- sensor: lidar
  ros_topic_name: "velodyne_points"
  gz_topic_name: "lidar/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# gz topic published by sensors plugin (IMU)
- sensor: imu
  ros_topic_name: "imu/data"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: GZ_TO_ROS

# gz topic published by sensors plugin (GPS)
- sensor: gps
  ros_topic_name: "gps/fix_no_cov"
  gz_topic_name: "gps"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "ignition.msgs.NavSat"
  direction: GZ_TO_ROS

# Camera
- sensor: cams
  lazy: true
  ros_topic_name: "cameras/front/color/image_raw"
  gz_topic_name:  "cameras/front/gzrgb/image_raw"
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS 


- sensor: cams
  lazy: true
  ros_topic_name: "cameras/front/depth/color/points"
  gz_topic_name: "cameras/front/gzdepth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS 


- sensor: cams
  lazy: true
  ros_topic_name: "cameras/front/color/camera_info"
  gz_topic_name: "cameras/front/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS

# Depth image (32FC1, meters). Added for the ramp detector, which reads the image
# instead of the much heavier depth point cloud.
- sensor: cams
  lazy: true
  ros_topic_name: "cameras/front/depth/image_raw"
  gz_topic_name: "cameras/front/gzdepth"
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

# View camera of the IMPRIMIS Control window (a simulator aid on a pan and tilt head; navigation does not use it).
- sensor: cams
  lazy: true
  ros_topic_name: "cameras/view/image_raw"
  gz_topic_name:  "cameras/view/gzrgb/image_raw"
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS

# Where the view camera should point, in radians. Pan is counted to the left, tilt downward.
- ros_topic_name: "view/pan_cmd"
  gz_topic_name: "view/pan_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "view/tilt_cmd"
  gz_topic_name: "view/tilt_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ
