      #     #   sweep of the Velodyne thickened the walls a little further inward. Measured in the bags: 35-57% of
      #     #   the lethal cells at the moment the robot stopped had no LiDAR return within 15 cm of them, and the
      #     #   free corridor across the robot closed from 2.23 m to 0.80 m over twelve seconds of driving, in a
      #     #   hallway the team measured at 2.13 m. All four runs reached a point where the cost map claimed less
      #     #   free width across the robot than the robot is wide. Ray-trace clearing removes a mark once the
