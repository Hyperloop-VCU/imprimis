local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["stvl_layer", "inflation_layer"] # ITER2: obstacle_layer -> stvl_layer
      # CHANGED: 10 m square. MPPI looks 2 s ahead; at 2.2 m/s that is 4.4 m, and any rollout
      # that leaves the local costmap is scored as a collision.
      height: 10
      width: 10
      origin_x: -5.0
      origin_y: -5.0
      # ITER5: was 10.0, equal to update_frequency, which ALIASES. Costmap2DROS gates the
      #   publish with `last_publish_ + publish_cycle_ < now` - a strict less-than - so when
      #   the publish period equals the update period the test fails on every other cycle.
      #   Measured on the iteration-5 bags: published_footprint (published unconditionally,
      #   once per update loop) came out at a median 100.0 ms, i.e. the update loop held 10 Hz
      #   exactly, while /local_costmap/costmap came out at a median 197 ms with a 45/55 split
      #   between 100 ms and 200 ms gaps - 6.4 Hz of jittery output from a 10 Hz loop.
      #   20.0 makes publish_cycle_ (0.05 s) strictly shorter than the loop period (0.1 s), so
      #   the gate passes every cycle and the topic is a true, even 10 Hz. It cannot publish
      #   faster than the loop runs, so this does not add a single extra map build; it costs
      #   160 kB x 3.6 extra messages/s on a topic rviz and the bag already subscribe to.
      publish_frequency: 20.0  # ITER1: was 5.0, and was only managing 1.5-2.7 Hz.
      update_frequency: 10.0  # ITER1: was 30.0. This map lives in the controller server's process and was
                              #   competing with MPPI for the same core; it only ever managed 15-22 Hz anyway.
                              #   10 Hz matches controller_frequency, which is as often as the map is read.
      # ITER3: was false. With false, Costmap2DPublisher::publishCostmap only sends a full
      #   /costmap message when the resolution, the size or the ORIGIN changes; otherwise it
      #   sends a delta on /costmap_updates. Both maps roll, so the origin only moves while the
      #   robot does - a STATIONARY robot publishes nothing on /costmap at all. That is why
      #   runs 2 and 4 of iteration 3, which deliberately parked the robot and waited for the
      #   decay, recorded no cost map during the wait, and why the cost map at the instant of
      #   run 8's failure is not in the bag either. Costs one full message per publish at the
      #   existing 2 Hz, not a higher rate.
      always_send_full_costmap: true
      rolling_window: true
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.025

      footprint_padding: 0.00 # MARGIN: was 0.02. Scoring with the simulator's true position showed the robot brushing barrels; the cost map cells are 0.1 m, so 0.02 m was less than one cell of error.
      # CHANGED: same outline as the global costmap
      # ITER4Y: re-derived from the re-measured URDF properties. Every vertex below is a
      #   derived quantity plus the SAME safety margin the previous footprint carried, so
      #   nothing here trades away margin - it only moves the outline to where the body
      #   actually is. Derivations, all in base_link (the drive axle), x forward:
      #     chassis front face  = wheel_radius              = +0.175   (chassis_joint is at
      #                                                                 -base_length + wheel_radius)
      #     chassis rear face   = -(base_length - radius)   = -0.847
      #     outer tire face     = track/2 + wheel_len/2     =  0.48141 from diffbot_controllers
      #                                                        wheel_separation 0.85487; the URDF's
      #                                                        own numbers give 0.48018, so the
      #                                                        larger of the two is used
      #     chassis half width  = base_width/2              =  0.3048
      #   margins preserved from the old outline: front +0.005, half width +0.00385,
      #   wide-section rear +0.035, tail half width +0.01885, rear +0.003.
      #
      #   THE IMPORTANT CHANGE IS NOT THE WIDTH. Width only drops 0.980 -> 0.970 m. But the
      #   outline SHIFTS 10 mm forward relative to base_link, because the URDF derives the
      #   chassis position from wheel_radius and that went 0.165 -> 0.175. Front +0.22 ->
      #   +0.23 and rear -0.86 -> -0.85: the tail is 10 mm SHORTER than the planner has been
      #   assuming. That matters most to DriveOnHeading's reverse check, which is exactly
      #   what vetoed all eight BackUps in iteration 4.
      #   See the note in the iteration-4 verification report: the URDF treats
      #   wheel_xoff as equal to wheel_radius, which it calls a coincidence. The axle's real
      #   distance from the chassis face does not change when a tire is re-measured, so that
      #   10 mm shift should be confirmed with a tape before it is trusted.
      #
      #   Derived properties: inscribed radius 0.220 -> 0.230 m, circumscribed 0.921 -> 0.910 m.
      footprint: "[ [0.230, 0.485], [0.230, -0.485], [-0.210, -0.485], [-0.210, -0.324], [-0.850, -0.324], [-0.850, 0.324], [-0.210, 0.324], [-0.210, 0.485] ]"

      track_unknown_space: false
      unknown_cost_value: 0

      # ======================= ITER2: ray-trace clearing replaced =======================
      # ObstacleLayer's clearing is 2D. raytraceFreespace reads only x and y from the cloud, so a
      # ray that passes OVER a short object on its way to a wall behind it erases that object's
      # cells. The Velodyne sits 1.23 m above the ground and looks 15 degrees down, so its lowest
      # ring is at 1.23 - 0.268 * range metres up: at 1.0 m range nothing below 0.96 m is visible
      # to any ring. A 0.9 m bin therefore drops out of the cloud inside about 1.2 m, and the rays
      # going past it to the wall wipe it off the map - exactly as the team saw in iteration 2.
      #
      # SpatioTemporalVoxelLayer does not ray-trace. It keeps a 3D voxel grid and forgets in two
      # separate ways:
      #   * every voxel decays on a timer (voxel_decay), so a stale mark goes by itself;
      #   * voxels INSIDE the sensor's frustum that were not seen again decay faster
      #     (decay_acceleration).
      # ClearFrustums only touches voxels for which the frustum's IsInside() is true, so a voxel
      # the sensor physically cannot see is never cleared - which is the property asked for.
      # ==================================================================================
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        # ITER6: BACK TO 30.0 for the first outdoor session, deliberately undoing the ITER5
        #   change to 60.0. The reason is not that 60.0 was wrong indoors - it was not - but
        #   that outdoor terrain is not planar, so returns that slip past ramp_detector's
        #   surface_max_height get marked as obstacles, and at 60.0 a false ground mark
        #   survives a full minute. That is the iteration-1 accumulation failure (marks pile
        #   up until no route exists) in a new form, and it is not worth carrying into a
        #   session whose whole purpose is to shake out GPS localisation. 30.0 also restores
        #   the value five iterations of indoor runs were tuned against, which is what keeps
        #   the outdoor runs comparable to them.
        #   WHAT THIS RE-OPENS, stated plainly: run 8's collision chain. Measured from
        #   real_bag8 - the robot stalls 1.02-1.15 m short of a goal whose tolerance is
        #   1.00 m, with the last bin between it and the goal. The bin is ~0.6-0.9 m tall and
        #   at that range the Velodyne's lowest ring is at 0.96 m (sensor 1.225 m up, -15 deg),
        #   so the bin sits below EVERY ring and is never re-observed while the robot waits
        #   there. Recovery cycles four times over 27 s. At t=93.8-95.4 s the lethal cells on
        #   the line to the goal go 94 -> 72 -> 39 -> 0 and the peak cost falls 254 -> 223 ->
        #   190: the bin is erased ~30 s after it was last seen, the planner returns a path
        #   straight through where it was, and the robot drives into it. No ClearEntireCostmap
        #   ran in that bag - this was decay alone.
        #   The four recovery episodes spanned 33 s, which is LONGER than this 30 s memory, so
        #   number_of_retries: 4 in recovery_nav_bt.xml can still outlive the map. The
        #   companion change, NOT made here because it was not asked for, is
        #   number_of_retries: 3 (~25 s), which puts the loop back inside the memory.
        #   Two mitigations are real outdoors and were absent in run 8: IGVC 2027 rules II.2
        #   guarantee a five-foot minimum passage width, so a waypoint with a barrel 1 m in
        #   front of it is far less likely than on a hand-built lab course; and the mechanical
        #   team is lowering the Velodyne, which closes the blind cone that made the bin
        #   unobservable at all (at 0.60 m a 0.60 m obstacle never goes blind).
        voxel_decay: 30.0             # s. How long an UNSEEN voxel survives. This is the only thing
                                      #   that forgets an obstacle out of the sensor's view, so it is
                                      #   deliberately long: the robot passes a bin in about 4 s.
                                      # ITER3: was 15.0. Iteration 3 raised the GLOBAL map to 30.0 but
                                      #   left this one at 15.0, so the two maps disagreed about how long
                                      #   an unseen obstacle lives, and the map the CONTROLLER reads was
                                      #   the forgetful one. Matched up.
                                      #   Measured on real_bag2 through a live cost map node: this number
                                      #   only decides the lifetime of voxels OUTSIDE the clearing
                                      #   frustum. Every cluster in that scene was inside it and died in
                                      #   0.7 s regardless of whether this said 15 or 30 - see
                                      #   change_report.pdf.
        decay_model: 0                # 0 = linear, 1 = exponential, -1 = never forget
        voxel_size: 0.025             # matches the cost map resolution, so a voxel is one cell
        track_unknown_space: false    # matches track_unknown_space below: unseen space is free
        mark_threshold: 0             # one voxel anywhere in the column marks the cell
        update_footprint_enabled: true
        combination_method: 1         # 1 = max
        origin_z: 0.0
        publish_voxel_map: false      # set true to inspect the voxel grid in RViz
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: velodyne_mark velodyne_clear lane_mark pothole_mark

        # ---- marking: the same filtered cloud and the same height band as before ----
        velodyne_mark:
          data_type: PointCloud2
          topic: /velodyne_points_nav
          marking: true
          clearing: false
          obstacle_range: 6.0
          min_obstacle_height: 0.2
          max_obstacle_height: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"             # collapse the 24 000-point cloud to one point per voxel
          voxel_min_points: 0
          clear_after_reading: true

        # ---- clearing: a frustum, not a ray ----
        velodyne_clear:
          enabled: true
          data_type: PointCloud2
          topic: /velodyne_points_nav
          marking: false
          clearing: true
          # ramp_detector republishes the cloud in base_link, which is 0.128 m off the ground and
          # 0.369 m ahead of the mast. Without this the frustum would be anchored there instead of
          # at the sensor, and the whole point of the change is that the frustum matches what the
          # Velodyne can actually see.
          sensor_frame: velodyne
          min_z: 1.0                  # m. Frustum near range. The VLP-16's own minimum range is
                                      #   about 1 m, so nothing nearer is ever cleared.
          max_z: 6.0               # m. Frustum far range; kept equal to obstacle_range so the
                                      #   layer never clears further out than it marks.
          vertical_fov_angle: 0.5236  # rad. The VLP-16's 30 degrees, symmetric about horizontal.
          vertical_fov_padding: 0.0   # padding WIDENS the frustum and so clears more. Keep at 0.
          horizontal_fov_angle: 6.29  # rad. The VLP-16 sees all the way round.
          decay_acceleration: 5.0     # 1/s^2. How much faster an in-view unseen voxel is forgotten.
          model_type: 1               # 1 = 3D lidar frustum, 0 = depth camera

        # ---- LANE / POTHOLE: unchanged in meaning, marking only, now with a decay timer ----
        lane_mark:
          data_type: PointCloud2
          topic: /perception/lane_points
          marking: true
          clearing: false
          obstacle_range: 6.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
        pothole_mark:
          data_type: PointCloud2
          topic: /perception/pothole_points
          marking: true
          clearing: false
          obstacle_range: 6.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

      # ---- ITER2: the ObstacleLayer this replaced, kept so the change can be undone ----
      # obstacle_layer:
