# Course2027.yaml
# Update of 4 October 2026 (search for SPEED): top speed 2.2 m/s, controller look-ahead 5 m. The node speed_governor
#   publishes speed_limit, so the top speed is only used where the path ahead is clear.
# Update of 3 October 2026 (search for REVERSE, LANE, RAMP):
#   REVERSE  slow reverse in the controller, the behavior server, and the recovery behavior tree
#   LANE     the lane mapper's points are a second obstacle source in both cost maps
#   RAMP     the cost maps read the ramp detector's filtered LiDAR cloud
# Launch with use_cams:=true use_recoveries:=true and the two perception nodes running
# (imprimis_mission sim_mission.launch.py does all of this). Without ramp_detector running the
# cost maps receive no LiDAR points at all.
# FullFootprint.yaml adjusted for the IGVC 2027 course world (igvc2027.sdf): tighter turns, lower speed,
# with the same inflation as FullFootprint.yaml. Select with nav2_params:=Course2027
# Changes from FullFootprint.yaml are marked COURSE.
#
# (header of FullFootprint.yaml follows)
# A copy of SmartPlannerSmartController.yaml in which the planner AND the controller both use the
# robot's real rectangular outline, so the long tail behind the drive axle is accounted for.
# Select it with:  nav2_params:=FullFootprint
#
# Outline, measured from base_link (the drive axle), from diffbot_description.urdf.xacro:
#   front +0.215 m, rear -0.842 m, half width 0.486 m at the wheels and 0.311 m along the tail.
#   The six-point outline below follows that shape and adds 10 to 20 mm.
#
# Changes from SmartPlannerSmartController.yaml (search for "CHANGED"):
#   1. global costmap: robot_radius 0.54 replaced by the six-point footprint polygon
#   2. local costmap: same polygon, and the map grows from 5 m to 10 m square
#   3. planner: minimum_turning_radius 0.2 -> 1.0 (the tail swings 0.30 m outside the wheel track at 0.2 m,
#      and 0.07 m at 1.0 m)
#   4. MPPI: vx_max 10.0 -> 2.2 (5 mph is 2.235 m/s), CostCritic enabled with the footprint
#   5. velocity smoother: 3.0 -> 2.2 m/s
# NOT YET RUN in simulation or on the robot. Compare against the original file before trusting it.

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odometry/filtered/local
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: $(find-pkg-share imprimis_navigation)/../../../../src/imprimis_navigation/nav2_bt/recovery_nav_bt.xml # REVERSE: was default_nav2_bt.xml, which has no recovery

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/home/imprimis-pc/Desktop/imprimis/imprimis_ws/src/imprimis_navigation/config/nav2/diff_2.5cm.json"   # CHANGED: your generated file
      tolerance: 2.0                     # Goal tolerance (m) if exact goal can't be reached
      allow_unknown: true                 # Plan through unknown space
      max_iterations: 1000000             # <= 0 disables the limit
      max_on_approach_iterations: 1000    # Extra iterations near goal to hit it exactly
      terminal_checking_interval: 5000    # Iterations between cancel/timeout checks
      max_planning_time: 5.0              # Seconds for planning + smoothing
      analytic_expansion_ratio: 3.5       # How often to try a direct shot to the goal
      analytic_expansion_max_length: 3.0  # Max length (m) of that direct shot
      analytic_expansion_max_cost: 200.0  # Max cell cost the direct shot may cross
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0                # Only applies if reversing is enabled
      change_penalty: 0.00                # default 0.05, Penalty for switching turn direction
      non_straight_penalty: 1.05          # Penalty for curved primitives
      cost_penalty: 2.0                   # How strongly to avoid high-cost cells
      rotation_penalty: 0.0               # default 0.5, Penalty for in-place rotations (diff/omni only)
      retrospective_penalty: 0.015        # Prefers later maneuvers; 0.0 = fully admissible
      lookup_table_size: 20.0             # Heuristic cache window (m)
      cache_obstacle_heuristic: false     # true speeds replanning a lot on static maps
      allow_reverse_expansion: false      # Allow reverse primitives
      goal_heading_mode: "DEFAULT"        # DEFAULT, BIDIRECTIONAL, or ALL_DIRECTION
      coarse_search_resolution: 1         # Heading step for non-DEFAULT goal modes
      debug_visualizations: false         # Publishes expansions and footprints
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

controller_server:
  ros__parameters:
    
    odom_topic: odometry/filtered/local
    robot_base_frame: base_link
    enable_stamped_cmd_vel: true
    controller_frequency: 10.0 # must be 1/model_dt
    goal_checker_plugins: ["goal_checker"]

    # GOAL CHECKER
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 6.28 # I don't care about the yaw
      stateful: True

    # MPPI CONTROLLER
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"

      # visualizer
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 1000
        time_step: 25

      # overall
      time_steps: 20 # default 56
      model_dt: 0.1 # default 0.05
      batch_size: 20000
      iteration_count: 1
      temperature: 0.3 # default 0.3
      gamma: 0.015 # default 0.015
      prune_distance: 5.0 # SPEED: was 1.7. The controller only looks this far along the path; 1.7 m held the robot near 1 m/s whatever vx_max said. Needs vx_max x 2 s.
      regenerate_noises: true # default false

      # linear
      vx_std: 0.4
      vx_max: 1.0 # SPEED: was 1.4. 2.2 m/s is 4.92 mph; the IGVC limit is 5 mph (2.235 m/s). The speed governor sets how much of this is used.
      vx_min: -0.35 # REVERSE: was 0.0 ("must not drive backwards"). Slow reverse lets the robot free itself; PreferForwardCritic keeps it driving forward otherwise.
      ax_max: 3.0
      ax_min: -3.0

      # angular
      wz_max: 0.4
      wz_std: 0.4 # default 0.4
      az_max: 3.5
      
      # lateral - these should all be zero;  diff drive robots can't move like that
      vy_std: 0.0
      vy_max: 0.0
      ay_min: 0.0
      ay_max: 0.0

      #reset_period: 1.0 # (only in Humble)

      # doesn't apply to us - we are diff drive
      #AckermannConstraints:
      #  min_turning_r: 0.2

      # critics
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0 # default 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.0 # default 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      #ObstaclesCritic:
      #  enabled: false
      #  cost_power: 1
      #  repulsion_weight: 1.5
      #  critical_weight: 20.0
      #  consider_footprint: true
      #  collision_cost: 0.0
      #  collision_margin_distance: 0.001 # very important
      #  near_goal_distance: 0.5
        #inflation_radius: 0.55 # (only in Humble)
        #cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true # CHANGED from false: the controller now checks the outline too
        cost_power: 1
        cost_weight: 3.81 # default 3.81
        critical_cost: 300.0
        consider_footprint: true
        near_collision_cost: 253 # CHANGED from 254 (Nav2 default)
        collision_cost: 1000000.0 # CHANGED from 400.0 (Nav2 default)
        near_goal_distance: 1.0
        trajectory_point_step: 1 # MARGIN: was 2. Check the outline at every step of a sampled path, not every second one.

      # Penalizes trajectories that lead the robot *too far away from the path*.
      # Penalizes trajectories that deviate from the path orientation.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05 # (0-1), if this much of the path is occupied,
        trajectory_point_step: 1 # default 4; how densely along the candidate trajectories to evaluate how far the robot is from the path, and how much it deviates from the angle
        threshold_to_consider: 0.5 # if we're this at least this close to the goal in m, deactivate this critic
        offset_from_furthest: 5 # default 20; if the candidate trajectories don't reach at least this far along the path (0 is the start of the path, 20 means 20 points ahead along the pruned path), deactivate this critic.
        use_path_orientations: true
      
      # Penalizes trajectories that don't make forward progress along the path
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      # Penalizes trajectories that deviate significantly from the path angle
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 10 # default 4; lookahead point. How far ahead of the furthest point along the candidate trajectory to reference
        threshold_to_consider: 0.5 # if we're at least this close to the goal in m, deactivate this critic
        max_angle_to_furthest: 1.0 # activate this critic if the robot's straight-line angle to the lookahead is greater than this in radians
        mode: 2 # default 0; determine what counts as "in line" with the angle. 0 - robot must face forward, 1 - robot can face forward or backward, 2 - robot must face whatever direction the path says
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.05, 0.05, 0.05]
      #TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "wall_layer", "inflation_layer"]
      height: 100
      width: 100
      origin_x: -50.0
      origin_y: -50.0
      publish_frequency: 5.0
      update_frequency: 30.0
      always_send_full_costmap: false
      rolling_window: true
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.025

      # CHANGED: the real outline instead of a 0.54 m circle around the drive axle
      footprint_padding: 0.00 # MARGIN: was 0.02. Scoring with the simulator's true position showed the robot brushing barrels; the cost map cells are 0.1 m, so 0.02 m was less than one cell of error.
      footprint: "[ [0.22, 0.49], [0.22, -0.49], [-0.20, -0.49], [-0.20, -0.33], [-0.86, -0.33], [-0.86, 0.33], [-0.20, 0.33], [-0.20, 0.49] ]"

      track_unknown_space: false
      unknown_cost_value: 0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: velodyne_data lane_data pothole_data # LANE: lane_data added. CORRIDOR: corridor_data added. POTHOLE: pothole_data added
        max_obstacle_height: 1.8
        min_obstacle_height: 0.3
        velodyne_data:
          topic: /velodyne_points # RAMP: was /velodyne_points. This is the cloud from ramp_detector, leveled with the IMU, ground and ramp surface removed.
          clearing: False    
          marking: True
          data_type: "PointCloud2"
          max_obstacle_height: 3.0
          min_obstacle_height: 0.2
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.2

        # LANE: white tape seen by the camera (lane_mapper). The points arrive 0.5 m above base_link
        # so that they pass the height limits of this layer.
        lane_data:
          topic: /perception/lane_points
          clearing: False
          marking: True
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
        
        # POTHOLE: potholes found by lane_mapper (painted white circles, and places where the ground drops away).
        # The robot's outline must stay off them, so they are marked like any other obstacle.
        pothole_data:
          topic: /perception/pothole_points
          clearing: False
          marking: True
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

      wall_layer:
        plugin: "costmap_wall::WallLayer"
        wall_relative_to: "base_link"
        y_offset: -5.0
        wall_length: 4.0
        cost_value: 254 # lethal obstacle

      # Add a "danger zone" around obstacles
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.7 # higher is more leniant (3.0 was tried on the course: the robot brushed barrels)
        inflation_radius: 3.0 # NOTE: THIS MUST BE LARGER THAN THE DISTANCE FROM BASE_LINK TO THE FURTHEST CORNER nav2 will tell you if it's too small.

      # Massive blank map, filled over time
      #static_layer:
      #  plugin: "nav2_costmap_2d::StaticLayer"
      #  enabled: true

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "inflation_layer"]
      # CHANGED: 10 m square. MPPI looks 2 s ahead; at 2.2 m/s that is 4.4 m, and any rollout
      # that leaves the local costmap is scored as a collision.
      height: 10
      width: 10
      origin_x: -5.0
      origin_y: -5.0
      publish_frequency: 5.0
      update_frequency: 30.0
      always_send_full_costmap: false
      rolling_window: true
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.025

      footprint_padding: 0.00 # MARGIN: was 0.02. Scoring with the simulator's true position showed the robot brushing barrels; the cost map cells are 0.1 m, so 0.02 m was less than one cell of error.
      # CHANGED: same outline as the global costmap
      footprint: "[ [0.22, 0.49], [0.22, -0.49], [-0.20, -0.49], [-0.20, -0.33], [-0.86, -0.33], [-0.86, 0.33], [-0.20, 0.33], [-0.20, 0.49] ]"

      track_unknown_space: false
      unknown_cost_value: 0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: velodyne_data lane_data pothole_data # LANE: lane_data added. CORRIDOR: corridor_data added. POTHOLE: pothole_data added
        max_obstacle_height: 10.0
        min_obstacle_height: -10.0
        velodyne_data:
          topic: /velodyne_points_nav # RAMP: was /velodyne_points. This is the cloud from ramp_detector, leveled with the IMU, ground and ramp surface removed.
          clearing: False
          marking: True
          data_type: "PointCloud2"
          max_obstacle_height: 3.0
          min_obstacle_height: 0.2
          raytrace_max_range: 6.0 # CHANGED with the larger local costmap
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0 # CHANGED with the larger local costmap
          obstacle_min_range: 0.2
        # LANE: white tape seen by the camera (lane_mapper). The points arrive 0.5 m above base_link
        # so that they pass the height limits of this layer.
        lane_data:
          topic: /perception/lane_points
          clearing: False
          marking: True
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

        # POTHOLE: potholes found by lane_mapper (painted white circles, and places where the ground drops away).
        # The robot's outline must stay off them, so they are marked like any other obstacle.
        pothole_data:
          topic: /perception/pothole_points
          clearing: False
          marking: True
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0


      # Add a "danger zone" around obstacles
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.7 # higher is more leniant (3.0 was tried on the course: the robot brushed barrels)
        inflation_radius: 1.3 # NOTE: THIS MUST BE LARGER THAN THE DISTANCE FROM BASE_LINK TO THE FURTHEST CORNER nav2 will tell you if it's too small.


velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 10.0
    feedback: "OPEN_LOOP"
    scale_velocities: false
    max_velocity: [2.2, 0.0, 1.5]    # CHANGED from [3.0, 0.0, 1.0]: 5 mph, and wz_max of the controller
    min_velocity: [-2.2, 0.0, -1.5]  # CHANGED from [-3.0, 0.0, -1.0]
    max_accel: [3.0, 0.0, 2.0]       # was [2.0, 0.0, 1.0]
    max_decel: [-3.0, 0.0, -2.0]     # was [-2.0, 0.0, -1.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    odom_topic: /odometry/filtered/local
    odom_duration: 0.1

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True



