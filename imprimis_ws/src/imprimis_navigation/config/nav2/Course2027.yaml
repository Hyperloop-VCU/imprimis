                                      #   about 1 m, so nothing nearer is ever cleared.
          max_z: 8.0               # m. Frustum far range; kept equal to obstacle_range so the
                                      #   layer never clears further out than it marks.
          vertical_fov_angle: 0.5236  # rad. The VLP-16's 30 degrees, symmetric about horizontal.
          vertical_fov_padding: 0.0   # padding WIDENS the frustum and so clears more. Keep at 0.
          horizontal_fov_angle: 6.29  # rad. The VLP-16 sees all the way round.
          decay_acceleration: 5.0     # 1/s^2. How much faster an in-view unseen voxel is forgotten.
          model_type: 1               # 1 = 3D lidar frustum, 0 = depth camera

        # ---- LANE / POTHOLE: unchanged in meaning, marking only, now with a decay timer ----
        lane_mark:
          data_type: PointCloud2
          topic: /perception/lane_points
          marking: true
          clearing: false
          obstacle_range: 6.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
        pothole_mark:
          data_type: PointCloud2
