        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.7 # higher is more leniant (3.0 was tried on the course: the robot brushed barrels)
        inflation_radius: 1.3 # NOTE: THIS MUST BE LARGER THAN THE DISTANCE FROM BASE_LINK TO THE FURTHEST CORNER nav2 will tell you if it's too small.


velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    # ITER4: was 10.0. Measured on every iteration-4 bag, the header stamp on each
    #   /diffbot_base_controller/cmd_vel message is 92 ms old at the median and 95-100 ms
    #   old whenever the robot is moving - one whole smoother period. The smoother
    #   republishes on its own clock and carries its INPUT's stamp, so a command issued by
    #   MPPI waits up to 1/smoothing_frequency here before it is sent on. At 10 Hz that is
    #   a mean 50 ms of pure queueing delay added to the 40-55 ms of real actuation dead
    #   time measured in latency_claude_3; at 20 Hz it is a mean 25 ms.
    #   Nothing about the shaping changes: feedback is OPEN_LOOP, so the ramp is set by
    #   max_accel/max_decel below and those are untouched - doubling the rate only halves
    #   how long a fresh command sits before it is acted on. It does not touch MPPI, which
    #   still runs at controller_frequency 10.0.
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    scale_velocities: false
    # ITER1: this is now the last line of defence, and it is deliberately set as one.
    #   MPPI's absolute-speed-limit path computes ratio = speed_limit / vx_max and does NOT clamp it to 1, so a
    #   speed_limit above vx_max scales wz UP without bound. These two caps hold whatever the governor asks for:
    #   2.235 m/s is exactly 5 mph, the IGVC limit, and 1.2 rad/s is a yaw rate this robot can actually turn at.
    max_velocity: [2.235, 0.0, 1.2]
    min_velocity: [-2.235, 0.0, -1.2]
    max_accel: [1.5, 0.0, 2.0]       # ITER1: was [3.0, 0.0, 2.0]; matches MPPI's ax_max/az_max
    max_decel: [-2.0, 0.0, -2.5]     # ITER1: was [-3.0, 0.0, -2.0]; braking is allowed to be firmer than
                                     #   accelerating, and measured peak deceleration was 1.4 m/s^2
    deadband_velocity: [0.0, 0.0, 0.0]
    # ITER5: was 1.0, and it was manufacturing a burst of rejected commands at every gap in
    #   the nav2 command stream. The smoother republishes on its own clock but carries its
    #   INPUT's header stamp (see smoothing_frequency above), and diff_drive_controller rejects
    #   any command whose stamp is older than its cmd_vel_timeout, which is 0.5 s
    #   (diffbot_controllers.yaml). So from 0.5 s to 1.0 s after the last real command the
    #   smoother is emitting messages the base throws away, and the base then brakes on its own
    #   watchdog instead of following the smoother's ramp.
    #   Measured on the iteration-5 bags, this is exact rather than approximate: every gap
    #   produced exactly 24 smoother outputs of which exactly 10 were rejected - 0.5 s at
    #   20 Hz - and the gaps are the 2 s unconditional Wait at the top of every recovery
    #   episode. real_bag10 had 9 gaps and 100 rejected commands, real_bag8 4 gaps and 50,
    #   real_bag2 3 gaps and 30. /cmd_vel_raw itself was clean throughout: median stamp age
    #   0.1-0.2 ms.
    #   Most of those gaps are a Wait, where a hard stop is harmless. One was not: the first
    #   gap in real_bag2 begins while the wheels are still doing 0.72 m/s, so the ramp that
    #   max_decel is there to shape was replaced by the base's own brake.
    #   0.4 s keeps every output the smoother emits younger than the base's 0.5 s threshold,
    #   so the ramp is honoured and nothing is discarded. It does shorten the ramp: from
    #   0.72 m/s at max_decel 2.0 m/s^2 the stop needs 0.36 s and still fits, but from the
    #   2.235 m/s cap it would not, and the base would brake as it does today.
    #   The alternative fix is on the other side - raise cmd_vel_timeout in
    #   diffbot_controllers.yaml - which I have NOT done, both because that file is outside
    #   what I change and because it would loosen the base's own watchdog.
    velocity_timeout: 0.4
    odom_topic: /odometry/filtered/local
    odom_duration: 0.1

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True



