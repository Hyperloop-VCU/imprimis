# Course2027.yaml
#
# ============================= ITERATION 1 (search for ITER1) =============================
# Tuned against the four real bags in iterations/1/RealBags. Four findings drove it:
#
#  1. Both cost maps had clearing: False on every observation source, so a cell once marked was
#     never unmarked. The walls grew inward all run. At the moment the robot stopped, 35-57% of
#     the lethal cells had no LiDAR return within 15 cm, and in all four runs the free corridor
#     across the robot fell to 0.75-0.80 m in a hallway measured at 2.13 m - narrower than the
#     robot's own 0.98 m. Fixed: clearing: True on velodyne_data in both maps.
#
#  2. The planner, not the controller, was what failed. /plan stopped one tree tick before the
#     recovery fired in each of the three failed runs; the robot's own centre cell was never
#     occupied, so this was NoValidPathCouldBeFound, not StartOccupied - there was simply no
#     footprint-feasible route left through the cost map of (1).
#
#  3. The yaw rate was pinned at exactly +/-0.200000 rad/s for 20-67% of every control sample,
#     because an absolute speed_limit scales MPPI's wz as well as its vx. See the note on vx_max.
#
#  4. The controller ran at 6.7-7.6 Hz against controller_frequency 10.0 in three of four runs.
#     The 100 x 100 m global cost map at 2.5 cm (16 M cells at 30 Hz) and a 20000 x 20 MPPI batch
#     with a footprint check at every point were the two costs; both are cut here.
#
# Full write-up, including the changes OUTSIDE this file that the team needs to make:
#     iterations/1/change_report.pdf
# =========================================================================================

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odometry/filtered/local
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: $(find-pkg-share imprimis_navigation)/../../../../src/imprimis_navigation/nav2_bt/recovery_nav_bt.xml # REVERSE: was default_nav2_bt.xml, which has no recovery

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/home/imprimis-pc/Desktop/imprimis/imprimis_ws/src/imprimis_navigation/config/nav2/diff_4cm.json"   # CHANGED: your generated file
      tolerance: 1.0                      # ITER1: was 2.0. Matched to xy_goal_tolerance, so a plan that ends
                                          #   short still ends inside the distance at which the robot stops.
      allow_unknown: true                 # Plan through unknown space
      max_iterations: 1000000             # <= 0 disables the limit
      max_on_approach_iterations: 1000    # Extra iterations near goal to hit it exactly
      # ITER5: was 5000. max_planning_time was NOT being honoured. The timeout is only
      #   tested once every terminal_checking_interval node expansions, so the planner
      #   overshoots the budget by however long the next 5000 expansions take. Measured
      #   off the behaviour tree log on the iteration-5 bags, against a 450 ms budget:
      #     real_bag10  9 failed plans, median 480 ms, individual 469/480/490/630/659/689 ms
      #     real_bag2   2 failed plans, 760 ms and 869 ms
      #   i.e. up to 1.9x the budget. 5000 expansions was cheap on the old 30x30 m map and
      #   is not on 100x100 m, because a blocked query now fans out across far more free
      #   space before it gives up. 1000 brings the overshoot back to ~1/5 of what it was;
      #   the check itself is a clock read, so the search cost of checking 5x more often is
      #   negligible next to the expansions between checks.
      #   This LOWERS worst-case planning latency; it does not make any query succeed that
      #   failed before. Whether the budget itself should be larger is a separate question -
      #   see the iteration-5 report, it is deliberately left at 0.45 for now.
      terminal_checking_interval: 1000    # Iterations between cancel/timeout checks
      max_planning_time: 0.45              # ITER1: was 5.0. Planning measured under 0.1 s in the real runs; a 5 s
                                          #   budget only delays the failure report, and the tree replans at 2 Hz.
      analytic_expansion_ratio: 3.5       # How often to try a direct shot to the goal
      analytic_expansion_max_length: 3.0  # Max length (m) of that direct shot
      analytic_expansion_max_cost: 200.0  # Max cell cost the direct shot may cross
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0                # Only applies if reversing is enabled
      change_penalty: 0.00                # default 0.05, Penalty for switching turn direction
      non_straight_penalty: 1.05          # Penalty for curved primitives
      cost_penalty: 3.0                   # ITER1: was 2.0. Pushes the route further from the walls, which is what
                                          #   we want in a 2.1 m corridor.
      rotation_penalty: 5.0               # ITER1: was 0.0. diff_2.5cm.json contains in-place rotation primitives
                                          #   (trajectory_length 0.000). The tail sweeps a 1.8 m circle, which is why
                                          #   Spin is kept out of the recovery tree; the planner must not use them either.
      retrospective_penalty: 0.015        # Prefers later maneuvers; 0.0 = fully admissible
      lookup_table_size: 20.0             # Heuristic cache window (m)
      cache_obstacle_heuristic: true     # true speeds replanning a lot on static maps
      allow_reverse_expansion: false      # Allow reverse primitives
      goal_heading_mode: "ALL_DIRECTION"  # ITER1: was "DEFAULT". We do not care which way the robot faces at the goal,
                                          #   so let the planner finish on whichever heading is cheapest.
      coarse_search_resolution: 2         # ITER1: 8 of the 16 goal headings are tried instead of all 16.
                                          #   Must divide number_of_headings (16) in diff_2.5cm.json.
      debug_visualizations: false         # Publishes expansions and footprints
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

controller_server:
  ros__parameters:
    
    odom_topic: odometry/filtered/local
    robot_base_frame: base_link
    enable_stamped_cmd_vel: true
    controller_frequency: 10.0 # must be 1/model_dt
    failure_tolerance: 0.3 # ITER1: added. One bad control cycle no longer drops the whole tree into recovery.
    goal_checker_plugins: ["goal_checker"]
    progress_checker_plugins: ["progress_checker"]

    # PROGRESS CHECKER
    # ITER1: added. This was running all along on Nav2's defaults (0.5 m every 10 s), unseen because it
    # was never written down. At 0.5 m/s, and slower still while squeezing past a bin, those defaults are
    # tight enough to abort a run that is in fact making progress.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.35
      # ITER5: was 20.0. This is the ONLY clock that notices a robot which is stuck while
      #   its plan is still valid, and it was the gate the team saw in run 8: the controller
      #   did not report "Failed to make progress" (error 105) until t=47.7 s, meaning the
      #   robot had failed to cover required_movement_radius since t=27.7 s - twenty seconds
      #   of standing still with no recovery attempted. Every OTHER recovery episode in the
      #   iteration-5 bags was triggered by a planner failure instead, and those reached the
      #   recovery branch in 1.2-1.8 s, which is why this went unnoticed until now.
      #   8.0 s still asks for only 0.35 m / 8 s = 0.044 m/s average. The slowest sustained
      #   speed measured anywhere in these ten runs was 0.197 m/s (run 10, median while
      #   moving), so there is a 4x margin before this fires on a legitimately crawling
      #   robot. Do not take it much below 8 s without re-measuring that margin.
      movement_time_allowance: 8.0

    # GOAL CHECKER
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0 # ITER1: was 0.3. Stop as soon as the robot is within 1 m of the waypoint.
      yaw_goal_tolerance: 6.28 # heading-agnostic: any final heading is accepted
      stateful: True

    # MPPI CONTROLLER
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"

      # visualizer
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 1000
        time_step: 25

      # overall
      time_steps: 30 # ITER1: was 20. 20 steps x 0.1 s x 0.5 m/s is 1.0 m of look-ahead, less than the robot is
                     #   long. 30 gives 3.0 s / 1.5 m, so a rollout can see past the robot's own tail.
      model_dt: 0.1 # default 0.05
      batch_size: 6000 # ITER1: was 20000. 20000 x 20 points with a footprint check at every one is what made the
                       #   controller run at 6.7-7.6 Hz against a 10 Hz controller_frequency in three of four runs.
      iteration_count: 1
      temperature: 0.3 # default 0.3
      gamma: 0.015 # default 0.015
      prune_distance: 4.0 # ITER1: was 5.0. At 0.5 m/s a 5 m window is ten seconds of path, and its far end falls
                          #   outside the 10 m local cost map, where MPPI counts the points as invalid.
                          # ITER3: was 2.5, which was right for vx_max 0.5 and is too short for 1.0, and is
                          #   the one provable reason raising vx_max to 1.0 bought almost nothing.
                          #   PathFollowCritic scores each rollout by the distance from its LAST point to the
                          #   path point (furthest_reached_path_point + offset_from_furthest). That carrot
                          #   normally sits ahead of every rollout, so reaching further always scores better -
                          #   but the index is clamped to path_size. The rollout horizon is
                          #   time_steps 30 x model_dt 0.1 = 3.0 s, which at 1.0 m/s is 3.0 m of trajectory,
                          #   against a path pruned to 2.5 m. Once the carrot clamps at the end of the pruned
                          #   path, a faster rollout ends FURTHER PAST the carrot and is penalised for it, so
                          #   the pruned length divided by the horizon, 2.5 / 3.0 = 0.83 m/s, is a hard
                          #   disincentive ceiling. Measured: MPPI's own output never passed 0.50 m/s in run 7
                          #   or 0.63 m/s in run 9, and 0 percent of moving samples reached 0.8 of the cap.
                          #   4.0 m clears the 3.0 m horizon and still sits inside the 10 m local cost map.
      regenerate_noises: true # default false

      # linear
      vx_std: 0.4  # ITER1: was 0.4. Half the sampling range is enough now that vx_max is 0.5; it was spending
                   #   most of the batch on samples that get clamped.
      # ITER1: vx_max was 1.0, and this one number was costing us the course.
      #   speed_governor publishes an ABSOLUTE speed limit, and MPPI's Optimizer::setSpeedLimit turns an
      #   absolute limit into ratio = speed_limit / vx_max and then applies that ratio to wz as well:
      #       s.constraints.wz = s.base_constraints.wz * ratio
      #   nav_perception.launch.py declares top_speed with a default of 0.5, so ratio was 0.5/1.0 = 0.5 and
      #   the real yaw limit was 0.4 * 0.5 = 0.20 rad/s. In the four bags the command sat at exactly
      #   +/-0.200000 rad/s for 20-67% of every control sample, while the lattice was asking for 0.45-1.5 m
      #   radii, i.e. 0.14-0.56 rad/s. 76% of planning cycles demanded more yaw than the controller could give.
      #   Setting vx_max to the governor's own top speed makes the ratio 1.0, so wz is no longer halved.
      #   IF YOU RAISE top_speed, RAISE THIS TO THE SAME NUMBER IN THE SAME COMMIT - see change_report.pdf.
      vx_max: 1.0
      vx_min: -0.3 # ITER1: was -0.35. Matches the 0.25 m/s the BackUp recovery asks for, with a little over.
      ax_max: 1.5  # ITER1: was 3.0. Measured from the bags, the robot reaches 0.3-0.56 m/s^2 (p95) and peaks
      ax_min: -1.5 #   at 1.4. MPPI rolls out trajectories with these numbers, so optimistic values make it
                   #   plan motions the robot cannot actually execute.

      # angular
      # ITER1: wz_max was 0.4. Read the note on vx_max first. 0.9 rad/s at 0.5 m/s is a 0.56 m turning radius,
      #   which covers the 0.5 m minimum radius the lattice in diff_2.5cm.json is built around.
      wz_max: 0.9
      wz_std: 0.45 # ITER1: was 0.4. Half the new range, so turns are explored as well as straight running.
      az_max: 2.0  # ITER1: was 3.5. Measured peak was 1.7 rad/s^2; the velocity smoother allows 2.0 anyway,
                   #   so 3.5 only let MPPI believe in yaw ramps the robot never delivers.
      
      # lateral - these should all be zero;  diff drive robots can't move like that
      vy_std: 0.0
      vy_max: 0.0
      ay_min: 0.0
      ay_max: 0.0

      #reset_period: 1.0 # (only in Humble)

      # doesn't apply to us - we are diff drive
      #AckermannConstraints:
      #  min_turning_r: 0.2

      # critics
      # ITER1: GoalAngleCritic dropped. It pulls the robot towards the goal's heading on the way in, and we do
      #   not care what the heading is - the goal checker accepts any of them.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5 # ITER1: was 1.0. Has to take over a little before the 1.0 m stop radius.
      # ITER1: GoalAngleCritic removed from the critics list above; its block is left here, disabled, so the
      #   numbers are still on hand if a heading-sensitive goal is ever wanted.
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      #ObstaclesCritic:
      #  enabled: false
      #  cost_power: 1
      #  repulsion_weight: 1.5
      #  critical_weight: 20.0
      #  consider_footprint: true
      #  collision_cost: 0.0
      #  collision_margin_distance: 0.001 # very important
      #  near_goal_distance: 0.5
        #inflation_radius: 0.55 # (only in Humble)
        #cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true # CHANGED from false: the controller now checks the outline too
        cost_power: 1
        cost_weight: 5.0 # ITER1: was 3.81. The costs this critic reads are the inflation field, so a heavier
                         #   weight is the direct way to ask for "as far from the walls as the path allows".
        critical_cost: 300.0
        consider_footprint: true
        near_collision_cost: 253 # CHANGED from 254 (Nav2 default)
        collision_cost: 1000000.0 # CHANGED from 400.0 (Nav2 default)
        near_goal_distance: 1.5 # ITER1: was 1.0. Follows xy_goal_tolerance.
        trajectory_point_step: 2 # ITER1: was 1. At 0.5 m/s and model_dt 0.1 the points are 5 cm apart, so every
                                 #   second one is a 10 cm check interval on a robot 1.08 m long - still far finer
                                 #   than the cost map's own 2.5 cm cells can resolve, and half the work.

      # Penalizes trajectories that lead the robot *too far away from the path*.
      # Penalizes trajectories that deviate from the path orientation.
      # ITER1 note on all three path critics: offset_from_furthest counts PATH POINTS, not metres, and the
      # Smac lattice hands us a path with 2.5-2.8 cm between points (measured: 390 poses over 9.96 m). The
      # values here were Nav2's defaults, which assume the ~5-10 cm spacing of the grid planners, so every
      # look-ahead was a quarter of what it was meant to be.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05 # (0-1), if this much of the path is occupied,
        trajectory_point_step: 2 # ITER1: was 1. See the note on CostCritic.trajectory_point_step.
        threshold_to_consider: 1.6 # ITER1: was 0.5. Hand over to GoalCritic before the 1.0 m stop radius.
                                   # ITER3: was 1.2. Scales with the look-ahead below.
        offset_from_furthest: 36 # ITER1: was 5, i.e. 13 cm of path. 20 points is 0.5 m, so the robot gets its
                                 #   bearing before this critic starts holding it to the line.
                                 # ITER3: was 20. Measured spacing in the iteration-3 plans is 2.8-2.9 cm
                                 #   (logged per plan by claude_tools/run_story.py), so 20 points was 0.57 m.
                                 #   36 points is 1.0 m, which is one second of path at the new 1.0 m/s cap.
        use_path_orientations: true
      
      # Penalizes trajectories that don't make forward progress along the path
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        offset_from_furthest: 45 # ITER1: was 5. This critic drags the end of each rollout towards the path point
                                 #   offset_from_furthest ahead of the furthest point the rollouts already reach.
                                 #   At 2.5 cm spacing that carrot was 13 cm out - no forward pull at all. 24
                                 #   points is 0.61 m.
                                 # ITER3: was 24. Measured spacing in the iteration-3 plans is 2.8-2.9 cm, so
                                 #   24 points put the carrot 0.68 m beyond the furthest rollout - sized for
                                 #   0.5 m/s, and under a quarter of the 3.0 s horizon at 1.0 m/s. The carrot
                                 #   has to stay ahead of the fastest rollout to keep rewarding speed, so it
                                 #   is scaled with the cap: 45 points is 1.27 m. See prune_distance above,
                                 #   which is the harder of the two limits.
        threshold_to_consider: 2.0 # ITER1: was 1.4. Follows xy_goal_tolerance.
                                   # ITER3: was 1.5. Has to exceed the look-ahead above or the critic switches
                                   #   itself off before the carrot is reachable.

      # Penalizes trajectories that deviate significantly from the path angle
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 36 # ITER1: was 10, i.e. 26 cm of path. 20 points is 0.5 m.
                                 # ITER3: was 20. Matched to PathAlignCritic above: 36 points is 1.0 m, so the
                                 #   robot lines up on where the path goes a second from now, not 0.57 m ahead.
        threshold_to_consider: 1.6 # ITER1: was 0.5. Follows xy_goal_tolerance.
                                   # ITER3: was 1.2. Scales with the look-ahead above.
        max_angle_to_furthest: 0.6 # ITER1: was 1.0. Starts lining the robot up at 34 degrees of error instead of
                                   #   57, so it enters the turn already pointing into it.
        mode: 2 # default 0; determine what counts as "in line" with the angle. 0 - robot must face forward, 1 - robot can face forward or backward, 2 - robot must face whatever direction the path says
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.05, 0.05, 0.05]
      #TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["stvl_layer", "wall_layer", "inflation_layer"] # ITER2: obstacle_layer -> stvl_layer
      # ITER1: was 100 x 100 m. At 0.025 m that is 16 MILLION cells, rebuilt and re-centred 30 times a second
      # (it is a rolling window, so every update copies the whole grid). The planner never looks more than a
      # few metres out and the waypoints in these tests were 6.5-7.9 m away. 30 x 30 m is 1.44 M cells.
      height: 100
      width: 100
      origin_x: -50.0
      origin_y: -50.0
      publish_frequency: 5.0  # ITER1: was 5.0 and was only managing 1.9-3.4 Hz. This topic is for RViz and the
                              #   speed governor; nothing in the planning loop reads it.
      update_frequency: 2.0   # ITER1: was 30.0. The tree replans at 2 Hz, so 5 Hz is already generous.
      # ITER3: was false. With false, Costmap2DPublisher::publishCostmap only sends a full
      #   /costmap message when the resolution, the size or the ORIGIN changes; otherwise it
      #   sends a delta on /costmap_updates. Both maps roll, so the origin only moves while the
      #   robot does - a STATIONARY robot publishes nothing on /costmap at all. That is why
      #   runs 2 and 4 of iteration 3, which deliberately parked the robot and waited for the
      #   decay, recorded no cost map during the wait, and why the cost map at the instant of
      #   run 8's failure is not in the bag either. Costs one full message per publish at the
      #   existing 2 Hz, not a higher rate.
      always_send_full_costmap: true
      rolling_window: true
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.04

      # CHANGED: the real outline instead of a 0.54 m circle around the drive axle
      footprint_padding: 0.00 # MARGIN: was 0.02. Scoring with the simulator's true position showed the robot brushing barrels; the cost map cells are 0.1 m, so 0.02 m was less than one cell of error.
      # ITER4Y: re-derived from the re-measured URDF properties. Every vertex below is a
      #   derived quantity plus the SAME safety margin the previous footprint carried, so
      #   nothing here trades away margin - it only moves the outline to where the body
      #   actually is. Derivations, all in base_link (the drive axle), x forward:
      #     chassis front face  = wheel_radius              = +0.175   (chassis_joint is at
      #                                                                 -base_length + wheel_radius)
      #     chassis rear face   = -(base_length - radius)   = -0.847
      #     outer tire face     = track/2 + wheel_len/2     =  0.48141 from diffbot_controllers
      #                                                        wheel_separation 0.85487; the URDF's
      #                                                        own numbers give 0.48018, so the
      #                                                        larger of the two is used
      #     chassis half width  = base_width/2              =  0.3048
      #   margins preserved from the old outline: front +0.005, half width +0.00385,
      #   wide-section rear +0.035, tail half width +0.01885, rear +0.003.
      #
      #   THE IMPORTANT CHANGE IS NOT THE WIDTH. Width only drops 0.980 -> 0.970 m. But the
      #   outline SHIFTS 10 mm forward relative to base_link, because the URDF derives the
      #   chassis position from wheel_radius and that went 0.165 -> 0.175. Front +0.22 ->
      #   +0.23 and rear -0.86 -> -0.85: the tail is 10 mm SHORTER than the planner has been
      #   assuming. That matters most to DriveOnHeading's reverse check, which is exactly
      #   what vetoed all eight BackUps in iteration 4.
      #   See the note in the iteration-4 verification report: the URDF treats
      #   wheel_xoff as equal to wheel_radius, which it calls a coincidence. The axle's real
      #   distance from the chassis face does not change when a tire is re-measured, so that
      #   10 mm shift should be confirmed with a tape before it is trusted.
      #
      #   Derived properties: inscribed radius 0.220 -> 0.230 m, circumscribed 0.921 -> 0.910 m.
      footprint: "[ [0.230, 0.485], [0.230, -0.485], [-0.210, -0.485], [-0.210, -0.324], [-0.850, -0.324], [-0.850, 0.324], [-0.210, 0.324], [-0.210, 0.485] ]"

      track_unknown_space: false
      unknown_cost_value: 0

      # ======================= ITER2: ray-trace clearing replaced =======================
      # ObstacleLayer's clearing is 2D. raytraceFreespace reads only x and y from the cloud, so a
      # ray that passes OVER a short object on its way to a wall behind it erases that object's
      # cells. The Velodyne sits 1.23 m above the ground and looks 15 degrees down, so its lowest
      # ring is at 1.23 - 0.268 * range metres up: at 1.0 m range nothing below 0.96 m is visible
      # to any ring. A 0.9 m bin therefore drops out of the cloud inside about 1.2 m, and the rays
      # going past it to the wall wipe it off the map - exactly as the team saw in iteration 2.
      #
      # SpatioTemporalVoxelLayer does not ray-trace. It keeps a 3D voxel grid and forgets in two
      # separate ways:
      #   * every voxel decays on a timer (voxel_decay), so a stale mark goes by itself;
      #   * voxels INSIDE the sensor's frustum that were not seen again decay faster
      #     (decay_acceleration).
      # ClearFrustums only touches voxels for which the frustum's IsInside() is true, so a voxel
      # the sensor physically cannot see is never cleared - which is the property asked for.
      # ==================================================================================
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        # ITER6: BACK TO 30.0 for the first outdoor session, deliberately undoing the ITER5
        #   change to 60.0. The reason is not that 60.0 was wrong indoors - it was not - but
        #   that outdoor terrain is not planar, so returns that slip past ramp_detector's
        #   surface_max_height get marked as obstacles, and at 60.0 a false ground mark
        #   survives a full minute. That is the iteration-1 accumulation failure (marks pile
        #   up until no route exists) in a new form, and it is not worth carrying into a
        #   session whose whole purpose is to shake out GPS localisation. 30.0 also restores
        #   the value five iterations of indoor runs were tuned against, which is what keeps
        #   the outdoor runs comparable to them.
        #   WHAT THIS RE-OPENS, stated plainly: run 8's collision chain. Measured from
        #   real_bag8 - the robot stalls 1.02-1.15 m short of a goal whose tolerance is
        #   1.00 m, with the last bin between it and the goal. The bin is ~0.6-0.9 m tall and
        #   at that range the Velodyne's lowest ring is at 0.96 m (sensor 1.225 m up, -15 deg),
        #   so the bin sits below EVERY ring and is never re-observed while the robot waits
        #   there. Recovery cycles four times over 27 s. At t=93.8-95.4 s the lethal cells on
        #   the line to the goal go 94 -> 72 -> 39 -> 0 and the peak cost falls 254 -> 223 ->
        #   190: the bin is erased ~30 s after it was last seen, the planner returns a path
        #   straight through where it was, and the robot drives into it. No ClearEntireCostmap
        #   ran in that bag - this was decay alone.
        #   The four recovery episodes spanned 33 s, which is LONGER than this 30 s memory, so
        #   number_of_retries: 4 in recovery_nav_bt.xml can still outlive the map. The
        #   companion change, NOT made here because it was not asked for, is
        #   number_of_retries: 3 (~25 s), which puts the loop back inside the memory.
        #   Two mitigations are real outdoors and were absent in run 8: IGVC 2027 rules II.2
        #   guarantee a five-foot minimum passage width, so a waypoint with a barrel 1 m in
        #   front of it is far less likely than on a hand-built lab course; and the mechanical
        #   team is lowering the Velodyne, which closes the blind cone that made the bin
        #   unobservable at all (at 0.60 m a 0.60 m obstacle never goes blind).
        voxel_decay: 30.0             # s. How long an UNSEEN voxel survives. This is the only thing
                                      #   that forgets an obstacle out of the sensor's view, so it is
                                      #   deliberately long: the robot passes a bin in about 4 s.
        decay_model: 0                # 0 = linear, 1 = exponential, -1 = never forget
        voxel_size: 0.025             # matches the cost map resolution, so a voxel is one cell
        track_unknown_space: false    # matches track_unknown_space below: unseen space is free
        mark_threshold: 0             # one voxel anywhere in the column marks the cell
        update_footprint_enabled: true
        combination_method: 1         # 1 = max
        origin_z: 0.0
        publish_voxel_map: false      # set true to inspect the voxel grid in RViz
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: velodyne_mark velodyne_clear lane_mark pothole_mark

        # ---- marking: the same filtered cloud and the same height band as before ----
        velodyne_mark:
          data_type: PointCloud2
          topic: /velodyne_points_nav
          marking: true
          clearing: false
          obstacle_range: 8.0
          min_obstacle_height: 0.2
          max_obstacle_height: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"             # collapse the 24 000-point cloud to one point per voxel
          voxel_min_points: 0
          clear_after_reading: true

        # ---- clearing: a frustum, not a ray ----
        velodyne_clear:
          enabled: true
          data_type: PointCloud2
          topic: /velodyne_points_nav
          marking: false
          clearing: true
          # ramp_detector republishes the cloud in base_link, which is 0.128 m off the ground and
          # 0.369 m ahead of the mast. Without this the frustum would be anchored there instead of
          # at the sensor, and the whole point of the change is that the frustum matches what the
