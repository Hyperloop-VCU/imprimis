# GENERATED from imprimis_navigation/config/nav2/Lane2027.yaml (local_costmap) on 2026-11-14 by the
# lane harness, for clearing_study.py. Everything as Lane2027 has it, except: no inflation layer (so a
# lethal cell is a mark), always_send_full_costmap true. Regenerate when Lane2027 changes.
costmap:
