        topic: /velodyne_points_nav
        marking: true
        clearing: false
        obstacle_range: 6.0
        min_obstacle_height: 0.2
        max_obstacle_height: 3.0
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        filter: voxel
